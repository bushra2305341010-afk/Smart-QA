# Local stack (laptop mode). See docs/15-setup-and-initialization.md §5.
name: smart-qa

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # Owner/migrator role. The runtime role saq_app is created by deploy/postgres/init (docs/07 §4).
      POSTGRES_USER: saq_migrator
      POSTGRES_PASSWORD: saq_dev_password
      POSTGRES_DB: saq
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saq_migrator -d saq"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible evidence store for local dev (ADR-010). Companies use their own S3 in production.
  s3:
    image: chrislusf/seaweedfs:4.00
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - s3-data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://saq_app:saq_dev_password@db:5432/saq
      MIGRATION_DATABASE_URL: postgresql+psycopg://saq_migrator:saq_dev_password@db:5432/saq
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://s3:8333
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Pipeline engine: crash recovery + outbox relay (ADR-002, ADR-012). Logs in as saq_worker.
  orchestrator:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["/app/.venv/bin/python", "-m", "apps.orchestrator"]
    env_file: [.env]
    environment:
      WORKER_DATABASE_URL: postgresql+psycopg://saq_worker:saq_dev_password@db:5432/saq
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Job consumers on Redis Streams (ADR-013): ingest now, more stages as they land.
  worker:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["/app/.venv/bin/python", "-m", "apps.workers"]
    env_file: [.env]
    environment:
      WORKER_DATABASE_URL: postgresql+psycopg://saq_worker:saq_dev_password@db:5432/saq
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://s3:8333
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  db-data:
  s3-data:
