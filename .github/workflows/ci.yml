name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: saq_migrator
          POSTGRES_PASSWORD: saq_dev_password
          POSTGRES_DB: saq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saq_migrator -d saq" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://saq_app:saq_dev_password@localhost:5432/saq
      MIGRATION_DATABASE_URL: postgresql+psycopg://saq_migrator:saq_dev_password@localhost:5432/saq
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Chromium for runner tests (-m browser)
        run: uv run playwright install --with-deps chromium
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (unit + integration) with coverage
        run: uv run pytest --cov --cov-report=term-missing

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    # Every PR proves the three production images still build (pushed only by release.yml).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, web, runner]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.component }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Production compose file is valid
        if: matrix.component == 'api'
        run: |
          cp .env.production.example .env.production && touch deploy/runner-ca.pem
          docker compose -f deploy/compose.prod.yml --env-file .env.production \
            --profile runner --profile bundled-s3 config -q
