[project]
name = "smart-autonomous-qa"
version = "0.1.0"
description = "AI multi-agent QA platform: understands a web app, plans, writes, runs and reports tests with cited ground truth."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - SE331 Capstone, DIU" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "anthropic>=1.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
# Migrations build DDL from module constants (no user input).
"apps/api/alembic/**" = ["S608", "E501"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["packages", "apps"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: needs running Postgres/Redis (docker compose up -d db redis)",
]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["apps", "packages"]
branch = true
omit = ["apps/api/alembic/*"]
